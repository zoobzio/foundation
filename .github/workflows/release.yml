name: Release

# Manual releases only — no auto Release PR. Trigger from the Actions tab
# ("Run workflow") or `gh workflow run Release` when you want to cut a release.
# The job applies any pending changesets (version bump + changelog), commits
# that to the branch it ran on, publishes to GitHub Packages, and pushes the
# tags.
on:
  workflow_dispatch:

# Never cancel a release mid-publish; queue instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version-bump commit and tags
  packages: write # publish to GitHub Packages

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # Full history so @changesets/changelog-github can resolve each changeset
      # to the commit/PR that introduced it, and so tags push cleanly.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # registry-url + scope write an .npmrc that routes @zoobzio/* to GitHub
      # Packages and reads the auth token from NODE_AUTH_TOKEN. Each package's
      # publishConfig.registry points at the same registry, so `changeset
      # publish` queries and publishes there.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          scope: "@zoobzio"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Apply every pending changeset: bump the version, rewrite the changelogs,
      # and delete the consumed changeset files.
      # GITHUB_TOKEN lets @changesets/changelog-github resolve each changeset to
      # the commit/PR that introduced it. The default Actions token suffices.
      - name: Version
        run: pnpm ci:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit the bump to the release branch. Skips cleanly when nothing was
      # pending — in that case Publish still ships any already-versioned commit
      # whose version isn't yet on the registry.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No pending changesets — nothing to version."
          else
            git commit -m "chore: release"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Build, then publish every package whose version isn't yet on GitHub
      # Packages. `changeset publish` detects pnpm and runs `pnpm publish`, so
      # `workspace:*` ranges are rewritten to real versions at pack time. The
      # workflow token authenticates: packages published from this repo are
      # linked to it and inherit its visibility.
      - name: Publish
        run: pnpm ci:release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push the tags changeset publish created for the released versions.
      - name: Push tags
        run: git push --tags
